apply plugin: 'com.android.library'

android {
    compileSdk {
        version = release(versions.target_sdk) {
            minorApiLevel = versions.target_sdk_min_revision
        }
    }

    splits {
        abi {
            enable true
            reset()
            include("arm64-v8a")
            universalApk false
        }
    }

    defaultConfig {
        minSdk versions.min_sdk
        targetSdk versions.target_sdk
        externalNativeBuild {
            ndkBuild {
                arguments += build_flags.ndk_build_platform
                arguments += build_flags.compiling_arguments
                arguments += build_flags.ndk_build_android_stl
                cFlags  = build_flags.common_c_flags
                cppFlags = build_flags.common_cpp_flags
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android_dummy.mk')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildToolsVersion versions.build_tools_version
    ndkVersion versions.ndk_version
    namespace 'com.opentouchgaming.saffal'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.androidx.documentfile // Version needed for API 19
    implementation 'androidx.annotation:annotation:1.10.0'
}
