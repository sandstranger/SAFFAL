apply plugin: 'com.android.library'

android {
    compileSdk {
        version = release(versions.target_sdk) {
            minorApiLevel = versions.target_sdk_min_revision
        }
    }

    splits {
        abi {
            enable true
            reset()
            include("arm64-v8a")
            universalApk false
        }
    }

    defaultConfig {
        minSdk versions.min_sdk
        targetSdk versions.target_sdk
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-$versions.native_android_platform_version",
                        "-DCMAKE_CXX_FLAGS=$build_flags.CMAKE_CXXFLAGS",
                        "-DCMAKE_C_FLAGS=$build_flags.CMAKE_CFLAGS",
                        "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
                        "-DCMAKE_SHARED_LINKER_FLAGS=$build_flags.CMAKE_SHADERLINKER_FLAGS",
                        "$build_flags.CMAKE_ANDROID_STL","-DANDROID_ARM_MODE=arm", "-D_FILE_OFFSET_BITS=64"
            }
        }
    }
    buildTypes {
        release {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=MinSizeRel"
                }
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version versions.cmake_version
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        prefab true
    }
    packagingOptions {
        exclude '**/libshadowhook.so'
        exclude '**/libshadowhook_nothing.so'
    }
    buildToolsVersion versions.build_tools_version
    ndkVersion versions.ndk_version
    namespace 'com.opentouchgaming.saffal'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.androidx.documentfile // Version needed for API 19
    implementation libs.androidx.annotation
    implementation libs.shadowhook
}
